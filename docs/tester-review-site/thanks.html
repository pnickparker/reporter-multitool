<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<title>Thank you</title>
<style>
  body { margin: 0; background: #15111f; color: #f4f1fb; font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 520px; margin: 0 auto; padding: 64px 16px; text-align: center; }
  .dot { width: 64px; height: 64px; border-radius: 50%; background: #12332a; border: 2px solid #3ddc97; margin: 0 auto 24px; display: grid; place-items: center; font-size: 32px; color: #3ddc97; }
  h1 { font-size: 1.6rem; margin: 0 0 12px; }
  p { color: #a99fc4; margin: 0; }
</style>
</head>
<body>
<div class="wrap">
  <div class="dot" aria-hidden="true">&#10003;</div>
  <h1>Thank you!</h1>
  <p>Your review is in. Nick may follow up with a quick call.</p>
</div>
</body>
</html>
